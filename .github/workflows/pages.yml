name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - name: Cut files (DXF) and layouts
        run: uv run python -m kotatsu.build
      - name: Site (runs the tests too; the results show on the page)
        run: uv run python -m kotatsu.site
      - name: Add the DXFs and an index
        run: |
          mkdir -p out/site/dxf
          cp out/dxf/parts/*.dxf out/site/dxf/
          cp out/BOM.md out/site/dxf/
          {
            echo '<!doctype html><meta charset="utf-8"><title>Kotatsu cut files</title>'
            echo '<h1>Kotatsu cut files (DXF, millimetres)</h1><ul>'
            for f in out/site/dxf/*.dxf; do n=$(basename "$f"); echo "<li><a href=\"$n\">$n</a></li>"; done
            echo '</ul><p><a href="BOM.md">BOM.md</a> lists the quantities. <a href="../">Back to the site</a></p>'
          } > out/site/dxf/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
