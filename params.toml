# All dimensions in millimetres. Single source of truth — see AGENTS.md.

[material]
name = "Baltic birch plywood, CNC routed"
t_nominal = 18.0
t_min = 17.0          # mill tolerance -1.05 (TODO-verify actual stock in app)
t_max = 18.9          # mill tolerance +0.85
density_kg_m3 = 700

[cnc]
bit_d = 6.35          # 1/4" router bit -> dogbone radius bit_d/2
part_gap = 5.0        # min spacing between parts (uMake)
sheet_margin = 20.0   # margin around sheet (uMake)
sheets = [[1524, 1524], [1524, 3048], [1219, 2438]]  # 60x60, 60x120, 48x96 in

[fit]
slot_clearance = 0.3      # added to t_max for cross-lap slots
tight = 0.2               # in-plane tenon/mortise clearance
mortise_height_extra = 0.5
wedge_taper = 0.125       # 1:8
inplane_c = 0.2           # per-side clearance for in-plane mating shapes (seams, keys)

[top]                 # owner, 2026-10: one round table, top cut as ONE piece (no seams)
shape = "round"       # round: length = width = diameter | rect (one piece, rounded corners)
length = 900.0        # = diameter
width = 900.0
corner_r = 20.0       # rect only

[frame]               # yagura: 4 straight "+" corner legs (2 crossed plates each) under a deck; no aprons
height = 385.0        # floor to the tenon tops (futon plane); + 18 top + ~10 futon ≈ 41 cm total
overhang = 120.0      # square frame 660 × 660 under the Ø900 top; its corners stay ≥ 10 mm inside the circle
ear = 50.0            # frame edge -> corner cross-lap centreline (visible "ear"); 40 mm ear arm outside the slot
leg_width = 120.0     # straight leg plates: 40 mm ear arm | slot | 10 mm shoulder + 50 mm tenon to the inner edge
foot_r = 6.0          # rounding of the plates' outer corners
lap_extra = 0.5       # each cross-lap slot is (leg height)/2 + this, so slot bottoms never bottom out; the floor sets height

[deck]                # horizontal plate on the legs' shoulders; the heater hangs under it
drop = 26.0           # deck top below the futon plane (room for the leg + cheek wedges above it)

[yagura]              # leg <-> deck joints
tenon_gap = 10.0      # each plate's tenon starts this far past the cross-lap slot (the shoulder on that side)
hole_h = 14.0         # wedge hole above the deck
hole_drop = 1.0       # hole bottom below the thinnest deck's top face, so the wedge bears on the deck
deck_inset = 10.0     # deck corners stay this far inside the round top
wedge_len = 60.0      # leg wedges: shorter than the cheek wedges so the two at each corner don't meet
wedge_head = 18.0     # (1:8 taper -> 10.5 mm foot)

[cheek]               # 2 on-edge plates under the deck; the heater screws into their inner faces
length = 372.0
height = 56.0         # = heater top gap + body height: cheeks end level with the heater bottom
tab_w = 50.0
tab_spacing = 300.0
tab_above_deck = 21.0 # tab top above (nominal) deck top
hole_h = 14.0         # wedge hole height
hole_drop = 1.0       # hole bottom below the thinnest deck's top face

[cheek_wedge]         # lies on the deck top, driven sideways through the tab hole: pulls the cheek up
length = 80.0
head = 18.0           # height at the thick end; taper fit.wedge_taper (foot 8)

[heater]               # PaletteLife 120V 400W (docs/heater.md). TODO-verify with calipers
model = "PaletteLife B0CKBS16YY"
mount = "side"         # side (screws into on-edge cheeks) | bracket (L-brackets under deck)
body_x = 292.0
body_y = 292.0
body_h = 51.0
cheek_clearance = 1.0  # cheek inner faces = body width + this
top_gap = 5.0          # heater top below the deck underside (TODO-verify manual clearances)
holes = []             # TODO measure: side screw positions

[comfort]
knee_w = 762.0        # owner, cross-legged: knees need 30" wide ...
knee_h = 317.5        # ... x 12.5" high
knee_reach_min = 95.0   # how far that knee zone must reach in under the top's edge (TODO-verify with owner)
tip_inset = 50.0      # tipping load is computed EN 12521 / EN 1730-style: pushed down at mid-side, 50 mm in from the edge
tip_min_n = 0.0       # no pass/fail limit until we have a real figure (EN 12521:2023 Table 2, or a bathroom-scale test); 0 = report only
heater_kg = 3.0       # for the tipping estimate (TODO weigh the PaletteLife)
futon_kg = 2.0

[room]                # for the Futon & rug page (docs/futons.toml has the candidates)
rug_d = 2440.0        # 8 ft round rug
futon_d = 2050.0      # planned futon (205 cm round = sellers' size for Ø90 round tables)
drape_k = 0.7         # footprint radius ~ futon radius - drape_k * (frame height + top): rough, futons slope out
zabuton = [550.0, 590.0]  # floor cushion w x d (standard meidosu size)

[layout]              # sheet nesting choices (kotatsu/cutlist.py, kotatsu/nest.py)
frame_grain = "horizontal"  # frame parts keep their grain where it looks right (legs: up the leg); "free" = any rotation
sets = [1]                  # cut layouts for this many copies of the whole set of [[tables]]

[shipping]
std_max_side_in = 48
oversize_max_side_in = 60
max_box_lb = 50

# ------------------------------------------------------------------------------------------------
# The table to build. (Earlier designs live in git history: the 1200 x 900 rectangle with decorative
# seams at tag seams-archive; the slab-side frame and a splayed-leg yagura at tag frame-variants-archive.)
[[tables]]
name = "yagura"
label = "Ø 900 round, yagura frame with straight legs"
