# All dimensions in millimetres. Single source of truth — see AGENTS.md.

[material]
name = "Baltic birch plywood, CNC routed"
t_nominal = 15.0      # v2: 15 mm throughout (v1 was 18 mm, uMake's "19mm"). TODO-verify which uMake menu entry
                      #   ("15mm" or "16mm") is 15 mm Baltic birch, and measure the sheet when it arrives
t_min = 14.1          # mill tolerance about -0.9: interpolated between 12 mm (-0.75) and 18 mm (-1.05), TODO-verify
t_max = 15.7          # mill tolerance about +0.7: interpolated between 12 mm (+0.55) and 18 mm (+0.85), TODO-verify
density_kg_m3 = 700
E_par = 9000.0        # bending modulus along the face grain, MPa (Baltic/Finnish birch 18 mm ~ 9-10 GPa; TODO-verify Riga Ply handbook)
f_m = 35.0            # bending strength along the face grain, MPa (characteristic, rough; TODO-verify)

[cnc]
bit_d = 6.35          # 1/4" router bit -> dogbone radius bit_d/2
part_gap = 5.0        # min spacing between parts (uMake)
sheet_margin = 20.0   # margin around sheet (uMake)
sheets = [[1524, 1524], [1524, 3048], [1219, 2438]]  # 60x60, 60x120, 48x96 in

[fit]
slot_clearance = 0.3      # added to t_max for slots that take a plate's thickness
crush_rib_r = 10.0        # bumps on each head slot wall (v2: sized for the thinnest sheet, yagura.rib_proud): the slot is
                          #   t_max + 0.3 = 16.0, t_min = 14.1 at the bumps (0.95 proud), snug on any stock
fit_sand = 1.0            # owner 2026-11: at the fit-up, sanding a crosspiece's faces (or the bumps) by up to about this a side is fine:
                          #   the thickest stock (15.7) needs 0.8 a side
crush_rib_at = [0.6]      # the head slot is short (25 mm): one pair of bumps, clear of its round bottom
tight = 0.2               # in-plane tenon/mortise clearance
mortise_height_extra = 0.5
wedge_taper = 0.125       # 1:8

[top]                 # owner, 2026-10-20: 860 x 860, ONE piece (was Ø 900 round: +$199 shipping, and round futons are
                      # hard to get). 860 packs in uMake's 91 cm box = free shipping (docs/quote.md). v2: a squircle
length = 860.0
width = 860.0
squircle_n = 8.0      # v2 (owner): a squircle, |x/a|^n + |y/a|^n = 1. n = 8 (owner 2026-11, softer; was 10) keeps the corner posts 20 mm inside
                      # the edge (n = 8: 20 mm; v1's R20 corners: 40 mm). Saves 111 g

[frame]               # yagura (v2, owner 2026-11: diagonal legs; the "+" legs are tag plus-legs-archive): at each corner
                      # one plate stands on the corner's diagonal, its outer end at the frame corner. A crosspiece drops
                      # into a short slot in its head, across it; the deck bears on the crosspiece's top edge, which
                      # gives the joint a cross_w-wide base against twisting (one plate alone rocks open at ~32 N)
height = 385.0        # floor to the tenon tops (futon plane); + 15 top + ~10 futon ≈ 41 cm total
overhang = 40.0       # owner 2026-10-20: legs as far apart as reasonable -> frame 780 x 780 under the 860 top
                      # (more room between the legs, much steadier; knees reach 40 mm under the edge on v1, 38 on v2)
ear = 60.0            # frame corner -> the crosspiece's slot centre, along the diagonal (the post is outside it). 60
                      #   keeps the crosspiece's ends 5 mm inside the frame's edges, so the deck covers them
leg_width = 140.0     # plate width under the deck, along the diagonal: post | slot | 10 | 50 tenon | 10
post_inset = 14.0     # above the deck the post starts this far in from the plate's outer end (below the deck the
                      #   plate still reaches the corner): on the diagonal the squircle top's edge comes closest, and
                      #   this keeps the post 18+ mm inside it
post_sweep_from = 0.0  # the post's outer edge sweeps in from this high up: from the floor (owner 2026-11: one gentle curve
                      #   the whole height of the leg, 14 mm in at the top; was from 240)
corner_n = 4.0        # v2 (owner 2026-11): leg corners are squircles (geom.squircle_corners), this exponent
foot_r = 12.0         # rounding of the plates' foot corners (v2: 12, was 6, to go with the squircle top)
shoulder_r = 6.0      # ... and of their top corners: keep it small, the 12 mm inner shoulder bears on the deck
top_r = 3.0           # the post and tenon tops: the top rests on them, hidden under it (6 tried 2026-11: no visible gain, and the
                      # top's FEA turned jumpy: its few working pads shift)

[deck]                # horizontal plate on the legs' shoulders; v2: the heater cradle drops into a well in its middle
drop = 26.0           # deck top below the futon plane (room for the leg wedges above it)
# v2 (owner): an X-shaped deck. A pad round each corner's mortises and lying wedge, a ring round the heater well,
# and four arms along the diagonals joining them, every inside corner filleted (kotatsu/yagura.py deck).
# uMake ships free up to a 91 cm box AND ~20 kg; the less deck, the less wood (cutting stays about the same).
arm_w = 36.0          # the diagonal arms (owner 2026-11: 36, was 30, for margin in kotatsu/loads.py deck_arms)
hand_n = 300.0        # the arms' check load: a hand pressing hard on the heater ring (+ the heater)
fillet_r = 150.0      # inside corners where the arms meet the ring (owner 2026-11: 150, was 90: smoother, and the deck
                      #   FEA drops from 65 to 60 % with tight wedges, 127 to 97 % slack)
edge_r = 12.0         # outside corners (must stay under arm_w / 2)
pad_margin = 20.0     # wood round every mortise (a hole)
bearing_margin = 5.0  # ... and past each lying wedge and each plate's top edge (owner: nothing more at the corners)
pad_fillet_r = 300.0  # where the pads meet the arms (owner 2026-11: 300, was 80, then 40): each pad flares out of its arm
pad_flare_reach = 300.0  # ... that fillet works only between a pad and its own arm, this far along the arm from the corner
pad_hull = true       # each corner pad is one convex outline round what needs wood (owner 2026-11: no wiggles to sand)
trim_r = 10.0         # ... and its far corners, where the deck stops beside each post, rounded (owner 2026-11). 10 leaves the
                      #   crosspieces' top edges covered but for ~9 mm2 at their tips (14 would bare 23)
ring_w = 40.0         # the ring beside the cheeks (x). It holds the futon up at mid-side, where the knees go:
                      # 40 keeps the opening there as deep as the H deck's (188 mm from the edge)
ear_margin = 15.0     # ... and past the cheek ears (y)

[yagura]              # leg <-> deck joints
head_slot = 25.0      # the plate's round-bottomed slot, from the shoulders down: the crosspiece's whole height. Short,
                      #   so the haunch can stay high, over the thighs (legs-forward sitting needs room up to 275 mm).
                      #   Leg FEA under the 200 N push: slot root 63 % (docs/fea.md; when it was tried: 36 mm deep 183 %,
                      #   dogbones instead of the round bottom 95 %)
cross_w = 90.0        # crosspiece length, across the plate (the joint's base against twisting)
cross_proud = 0.5     # the crosspiece is cut this much taller than its slot: sand its top edge at the fit-up
                      #   until the deck sits on it and on the plate's shoulders together (TODO-verify at fit-up)
cross_r = 8.0         # the crosspiece's lower corners (the top ones stay 3: they bear on the deck)
cross_end_h = 14.0    # its underside arches up to this at the ends (owner 2026-11: shave and smooth): each half is a
                      #   little cantilever loaded at its end (about 22 % of the rough strength at its root)
tenon_gap = 10.0      # each plate's tenon starts this far past the head slot (the shoulder on that side)
tenon_w = 50.4        # tenon width (>= wedge hole + 2 x 15 mm); leg width beyond it is an inner shoulder
hole_h = 14.0         # wedge hole above the deck
hole_drop = 1.0       # hole bottom below the thinnest deck's top face, so the wedge bears on the deck
corner_posts = true   # each plate's outer end rises past the deck to the top as a post: the top rests at the frame
                      # corners (deck corners cut away around them); pressed at the very edge, the loose top lifts at
                      # ~637 N vs ~280 N without (comfort.top_lift; 50 mm in from the edge it never does)
leg_narrow = 56.0     # below the haunch the leg keeps this much width (owner 2026-11: 56, was 70, slimmer with the kick;
                      #   the longer haunch below keeps the head slot's root at 63 % under the 200 N push: docs/fea.md)
leg_haunch_top = 305.0  # the plate is full width from here up, past the head slot's bottom (~314): the slot never
                      #   leaves a thin finger beside it ("+" legs: 320). Room between the legs 642 mm (comfort.legroom, up to
                      #   275 mm: the 50 mm haunch below reaches into it; "+" legs: 638)
leg_haunch_drop = 50.0  # ... and reaches the narrow line this much lower (owner 2026-11: 50, was 30: a gentler slope moves
                        #   the bend away from the slot root; 30 with the slim leg would be 106 %)
leg_haunch_r = 60.0   # the haunch's S-curve: each bend takes up to this along its edges (owner 2026-11: 60, was 30)
leg_taper_top = 220.0 # full leg_narrow down to here, then a soft taper (owner 2026-11: from 220, was 150: one long line from the
                      # haunch to the foot; at the time leg FEA 74 %, 3 mm more room between the legs) ...
leg_foot_w = 46.0     # ... then the inner edge bends in to this at the floor (owner 2026-11: 46, was 56; narrower can't
                      #   be cut: the foot rounding and relief no longer fit)
leg_taper_r = 110.0   # ... with a long squircle bend where the taper starts (110, was 70)
leg_kick = 30.0       # the lower leg sweeps outwards, both edges together, by this much at the floor (owner 2026-11: 30,
                      #   "more japanese-ish"); the feet stand ~24 mm past the top's edge, and tipping the table by
                      #   pressing on the very edge takes ~4.5 kN (50 mm in, at the EN loading point, it can't tip)
leg_kick_n = 2.0      # ... shaped (1 - z/leg_curve_top)^n: 2 spreads the curve up the leg
leg_curve_top = 290.0 # ... fading out, with no slope, here: below the head slot, so the joints are untouched
foot_relief = 1.5     # shallow arc under each plate's foot: it stands on its two ends
foot_relief_margin = 20.0  # past the foot rounding: each end stands on a flat ~8 mm pad
wedge_len = 60.0      # the leg wedges (v2: the only wedges; the heater cradle hangs by gravity)
wedge_head = 18.0     # (1:8 taper -> 10.5 mm foot)
wedge_head_r = 8.0    # v2 (owner 2026-11): the struck head squircled (the long faces stay straight: they clamp)

[cheek]               # v2 "cradle": 2 on-edge plates the heater screws in between (on the bench). The pair drops into
                      # the deck's heater well; an ear at each end rests on the deck top. Gravity holds it: no wedges
bottom_r = 20.0       # v2 (owner 2026-11): squircle corners. The bottom, hanging in the well ...
top_r = 12.0          # ... the top, under the futon ...
ear_r = 8.0           # ... and the ears' undersides, which rest on the deck
ear_len = 40.0        # each ear's bearing on the deck top, past the well
ear_h = 16.0          # cheek height above the deck top (the ears' depth: kept a sheet's thickness), under the futon
                      # (owner 2026-11: 16, was 24; the heater moved down below its panel's clearance)
below_screw = 12.5    # the cheeks reach this far below the heater's screw line (wood round the screws), no further
                      # (owner 2026-11: the screws are near the heater's top, so the cheeks can be short)


[optimize]            # kotatsu/optimize.py, the design-space search (make optimize; out/optimize/)
samples = 384         # stage 1: cheap checks (geometry, cuttable, box, price, weight, knee room) on a Sobol sample
fea_budget = 48       # stage 2: FEA on the most promising (the leg plate under the push, alone and with the top's
                      # corner load; the deck's hand cases)
seed = 7
use_max = 0.90        # FEA: worst share of strength (Tsai-Hill) allowed in those hard cases
sway_max = 10.0       # FEA: sway under fea.push_n (mm)
fea_leg_h = 6.0       # coarser meshes than docs/fea.md's (same sway; peaks within a few %), for speed
fea_deck_h = 10.0
refine_share = 0.5    # share of fea_budget spent refining around the best designs (the rest spreads over the range)
refine_step = 0.06    # refining moves each knob by about this share of its range
refine_seeds = 6      # ... around this many of the best so far

[optimize.knobs]      # [low, high] for each knob the search may move (the top's squircle stays the owner's)
"deck.arm_w" = [28.0, 50.0]
"deck.fillet_r" = [50.0, 180.0]
"deck.ring_w" = [30.0, 60.0]
"yagura.leg_narrow" = [50.0, 90.0]
"yagura.leg_haunch_top" = [290.0, 330.0]
"yagura.leg_haunch_drop" = [20.0, 60.0]
"yagura.leg_taper_top" = [100.0, 270.0]
"yagura.leg_foot_w" = [46.0, 70.0]


[heater]               # PaletteLife 120V 400W (docs/heater.md). Owner measured 29 x 29 x 5 cm (2026-10-19, to the cm)
model = "PaletteLife B0CKBS16YY"
body_x = 290.0
body_y = 290.0
body_h = 50.0
cheek_clearance = 4.0  # cheek inner faces = body width + this; 4 mm covers a 290-293 mm body (measured to the cm)
top_rise = 14.0        # the heater's top above the deck top at most (owner 2026-11: 10 mm of air under the cheek tops) ...
panel_h = 35.0         # ... but its control panel (power inlet, switch, knob) is on one end, from the grille side up: this
                       #   high above the heater's bottom face (TODO-verify: read off the listing's photo; measure it)
panel_clear = 5.0      # ... and the panel's top stays this far below the deck's underside, so the knob and the plug stick
                       #   out under the deck's ring, not into the well's end wall (owner 2026-11)
screw_from_top = 12.5  # the side screw holes, below the heater's top (owner 2026-11: 10-15 mm)
end_clearance = 10.0   # heater well length = body_y + this (a 290-293 body; TODO-verify nothing sticks out at the ends)
holes = []             # not cut: the owner drills the heater's screw holes on assembly

[stiffness]           # wobble check (kotatsu/stiffness.py): estimates, TODO-verify the material values
twist_n = 115.0       # diagonal legs: the twist check, a sideways push along the edge at a top corner (N)
E_perp = 500.0        # plywood stiffness through its thickness (shoulder/wedge bearing on the deck), MPa: rough, 300-800
wedge_preload = 300.0 # clamp force a tapped-in leg wedge gives (N): rough guess
bearing_len = 20.0    # length over which in-plane bearing (tenon face on mortise end) spreads, mm: rough
report_loads = [50.0, 100.0, 200.0]   # sideways pushes at table height to report (N)

[loads]               # kotatsu/loads.py: the loose top under everyday loads (owner 2026-10-20). Rough values, TODO-verify
E_cross = 6500.0      # top's bending stiffness across the face grain, MPa (birch ply ~0.7 x along)
G_plate = 620.0       # in-plane shear modulus (sets the twisting stiffness), MPa
f_m_cross = 30.0      # bending strength across the face grain, MPa (characteristic, rough)
f_v_plate = 9.0       # twisting (in-plane) shear strength at the face, MPa (rough)
nap_kg = 30.0         # head + forearms + some chest resting on the table while napping hunched over
slump = 1.5           # flopping down onto it
cat_kg = 7.0
cat_impact = 4.0      # a cat landing from a jump: peak ~3-4 x body weight on the front paws
laptop_kg = 2.0
sitter_kg = 80.0      # 'beyond normal' check: someone sits on the table

[fea]                 # kotatsu/fea.py: finite-element checks (docs/fea.md). Mesh sizes are element sizes (mm)
top_h = 20.0          # the top (converged to ~2 % at 20, docs/fea.md)
deck_h = 8.0          # the X deck (36 mm arms: 4-5 elements across)
hand = 80.0           # a pressing hand's patch, square (mm). TODO-verify: a palm is ~80 x 100
leg_h = 3.0           # the leg plates (dogbones are 3.2 mm in radius: their arcs are meshed finer anyway)
push_n = 200.0        # sideways push at table height for the leg plates, shared as stiffness.frame_sway says

[comfort]
knee_w = 762.0        # owner, cross-legged: knees need 30" wide ...
knee_h = 317.5        # ... x 12.5" high (on the bare floor, owner 2026-11)
thigh_h = 160.0       # legs out forward on the bare floor (the zaisu posture, owner 2026-11): top of the thigh
                      # just above the knee (TODO-verify: owner to measure; 160 is a typical adult. With the 10 cm
                      # cushions there's room for thighs up to about 200 mm)
foot_h = 220.0        # ... and the top of the toes, relaxed (TODO-verify: owner to measure)
leg_margin = 15.0     # air left above thighs and feet
knee_margin = 5.0     # the deck's underside clears the knees (knee_h) by at least this at mid-side
heater_keepout = 20.0 # ... and the knee zone stays this far (plan) from the heater's body, if it hangs below knee_h
legroom_from = 20.0   # legroom (between two legs, legs forward) is measured from this high off the floor up
chair_seat_h = 100.0  # a bought zaisu (owner 2026-11: the plywood ones are archived, tag zaisu-archive): its seat
                      # sat on, padding included, above the floor (TODO-verify: measure it when it comes)
legroom_min = 560.0   # room between two legs where shins and thighs pass, legs forward (comfort.legroom). About
                      # what v1 gives at knee height, which the owner finds fine (TODO-verify with the measurements)
knee_reach_min = 35.0   # how far that knee zone must reach in under the top's edge (owner chose the 780 frame: 40)
tip_inset = 50.0      # tipping load is computed EN 12521 / EN 1730-style: pushed down at mid-side, 50 mm in from the edge
tip_min_n = 0.0       # no pass/fail limit until we have a real figure (EN 12521:2023 Table 2, or a bathroom-scale test); 0 = report only
heater_kg = 3.0       # for the tipping estimate (TODO weigh the PaletteLife)
futon_kg = 2.0

[room]                # for the Futon & rug page (docs/futons.toml has the candidates)
rug_d = 2440.0        # 8 ft round rug
futon_d = 3048.0      # owner 2026-11: an oversized king quilt, 120 x 120 in, "works really well" (planned: an 80 x 80 in futon)
futon_spread_d = 2240.0  # ... folded and tucked so it doesn't spread so much (owner 2026-11): it drapes like a square this
                      #   size, its floor edge about the middle of the pillows (the 3-D view and the room plan use this)
drape_k = 0.7         # footprint radius ~ futon radius - drape_k * (frame height + top): rough, futons slope out
zabuton = [635.0, 635.0]  # owner 2026-10-20: square floor pillows, 25 x 25 in
zabuton_h = 90.0      # pillow thickness (3-D view)
zabuton_tuck = 317.5  # each pillow's inner edge sits this far under the futon's floor edge: the quilt covers about half of
                      #   each pillow (owner 2026-11; was 150)
rug_margin = 20.0     # ...and further in if needed, so every pillow (corners too) stays this far inside the rug
zabuton_ramp = 80.0   # 3-D view: the futon eases from the floor onto a pillow over this distance
rug_t = 10.0          # rug thickness (3-D view)
futon_gap = 12.0      # 3-D view: the top sits this far above the frame, on the futon

[layout]              # sheet nesting choices (kotatsu/cutlist.py, kotatsu/nest.py)
frame_grain = "horizontal"  # frame parts keep their grain where it looks right (legs: up the leg); "free" = any rotation
sets = [1]                  # cut layouts for this many copies of the whole set of [[tables]]

[shipping]            # uMake's free shipping, as observed at checkout (docs/quote.md)
box_max = 910.0       # longest box side, mm (a 91 cm box ships free; 87 cm parts + packing fit)
packing = 50.0        # what the packing adds to the longest part's side, mm (the box check: part + this <= box_max)
free_kg = 18.9        # heaviest order that shipped free for us (20.4 kg did not)

# ------------------------------------------------------------------------------------------------
# The table to build. (Earlier designs live in git history: the 1200 x 900 rectangle with decorative
# seams at tag seams-archive; the slab-side frame and a splayed-leg yagura at tag frame-variants-archive.)
[[tables]]
name = "yagura"
label = "860 × 860 square, yagura frame with slim legs"
