# All dimensions in millimetres. Single source of truth — see AGENTS.md.

[material]
name = "Baltic birch plywood, CNC routed"
t_nominal = 18.0
t_min = 17.0          # mill tolerance -1.05 (TODO-verify actual stock in app)
t_max = 18.9          # mill tolerance +0.85
density_kg_m3 = 700

[cnc]
bit_d = 6.35          # 1/4" router bit -> dogbone radius bit_d/2
part_gap = 5.0        # min spacing between parts (uMake)
sheet_margin = 20.0   # margin around sheet (uMake)
sheets = [[1524, 1524], [1524, 3048], [1219, 2438]]  # 60x60, 60x120, 48x96 in

[fit]
slot_clearance = 0.3      # added to t_max for cross-lap slots
tight = 0.2               # in-plane tenon/mortise clearance
mortise_height_extra = 0.5
wedge_taper = 0.125       # 1:8
inplane_c = 0.2           # per-side clearance for in-plane mating shapes (seams, keys)

[top]
length = 1200.0
width = 800.0
corner_r = 20.0
split = "ari-3"       # name of one entry in [[top.options]] (or "none" = single slab)
boards = 3            # owner: 3 boards across the length (400 mm visible each); 2 also works
mirror = true         # mirror alternate seams so the middle board is symmetric

# Seam variants for the split top. Each is rendered on the project site for comparison.
# kind: ari (dovetail) | kama (gooseneck) | puzzle (jigsaw) | lobes (wave of circles) | chigiri (bow-tie keys)
[[top.options]]
name = "ari-3"
kind = "ari"
label = "Ari-tsugi, 3 alternating dovetails"
count = 3
depth = 70.0
root = 55.0
tip = 95.0

[[top.options]]
name = "ari-5"
kind = "ari"
label = "Ari-tsugi, 5 small alternating dovetails"
count = 5
depth = 50.0
root = 38.0
tip = 66.0

[[top.options]]
name = "ari-2-bold"
kind = "ari"
label = "2 bold dovetails, same direction"
count = 2
alternate = false
depth = 110.0
root = 90.0
tip = 170.0

# --- ari-2-bold family (owner likes the geometric look) -------------------------------
[[top.options]]
name = "bold-tsuzumi"
kind = "ari"
label = "Bold, reversed: middle board flares out like a tsuzumi drum"
count = 2
dirs = [-1, -1]
depth = 110.0
root = 90.0
tip = 170.0

[[top.options]]
name = "bold-yabane"
kind = "ari"
label = "Bold, skewed tails: arrow-feather (yabane) chevrons"
count = 2
alternate = false
skew = [-14.0, 14.0]   # degrees per tail; mirrored on the other seam
depth = 110.0
root = 80.0
tip = 180.0

[[top.options]]
name = "bold-nested"
kind = "ari"
label = "Bold tails, each with a small reverse tail nested in its tip"
count = 2
alternate = false
depth = 110.0
root = 90.0
tip = 170.0
counter_depth = 45.0
counter_root = 36.0
counter_tip = 62.0

[[top.options]]
name = "bold-rhythm"
kind = "ari"
label = "Big-small-big alternating tails"
count = 3
ys = [0.2, 0.5, 0.8]
scale = [1.0, 0.6, 1.0]
depth = 105.0
root = 80.0
tip = 150.0

[[top.options]]
name = "bold-yabane-rhythm"
kind = "ari"
label = "Yabane x rhythm: big skewed tails + small reversed centre tail"
count = 3
ys = [0.2, 0.5, 0.8]
dirs = [1, -1, 1]
scale = [1.0, 0.6, 1.0]
skew = [-14.0, 0.0, 14.0]
depth = 110.0
root = 80.0
tip = 170.0

[[top.options]]
name = "bold-yabane-rhythm-same"
kind = "ari"
label = "Yabane x rhythm, all three tails pointing the same way"
count = 3
ys = [0.2, 0.5, 0.8]
dirs = [1, 1, 1]
scale = [1.0, 0.6, 1.0]
skew = [-14.0, 0.0, 14.0]
depth = 110.0
root = 80.0
tip = 170.0


[[top.options]]
name = "bold-hishi"
kind = "hishi"
label = "Diamond heads (hishi) on short necks"
count = 2
alternate = false
neck = 44.0
neck_len = 25.0
head_len = 130.0
head_w = 150.0

[[top.options]]
name = "bold-kikko"
kind = "hishi"
label = "Long hexagon heads (kikko, tortoise shell)"
count = 2
alternate = false
neck = 44.0
neck_len = 25.0
head_len = 140.0
head_w = 130.0
flat = 60.0


[[top.options]]
name = "kama-3"
kind = "kama"
label = "Kama-tsugi (gooseneck), 3 alternating"
count = 3
neck = 30.0
neck_len = 35.0
head_len = 45.0
head_root = 60.0
head_tip = 75.0

[[top.options]]
name = "puzzle-3"
kind = "puzzle"
label = "Jigsaw tabs, 3 alternating"
count = 3
head_r = 34.0
neck = 36.0

[[top.options]]
name = "seigaiha-8"
kind = "lobes"
label = "Seigaiha wave: 8 interlocking round lobes"
count = 8
r = 40.0
offset = 0.6          # lobe centre past the seam, x r  (0.6 -> mouth = 1.6 r < 2 r, so it locks)

[[top.options]]
name = "chigiri-3"
kind = "chigiri"
label = "Chigiri: 3 through bow-tie keys, straight seam"
count = 3
length = 120.0
width = 64.0
waist = 30.0

[frame]
height = 375.0        # + 18 top + ~10-20 futon = 400-410 total (owner: 39-41 cm)
overhang = 40.0       # top overhang beyond frame on every side
ear = 45.0            # panel end -> crossing centreline
apron_depth = 110.0
leg_width = 130.0     # measured from panel end
opening_r = 50.0      # fillet radius of leg opening

[deck]
length_x = 500.0
drop = 25.0           # deck top below apron top edge
tenons_per_side = 2
tenon_width = 120.0
tenon_protrusion = 50.0   # past outer apron face

[heater]               # PaletteLife 120V 400W (docs/heater.md). TODO-verify with calipers
model = "PaletteLife B0CKBS16YY"
mount = "side"         # side (screws into on-edge cheeks) | bracket (L-brackets under deck)
body_x = 292.0
body_y = 292.0
body_h = 51.0
cheek_clearance = 1.0  # cheek inner faces = body width + this
holes = []             # TODO measure: side screw positions

[shipping]
std_max_side_in = 48
oversize_max_side_in = 60
max_box_lb = 50
