# All dimensions in millimetres. Single source of truth — see AGENTS.md.

[material]
name = "Baltic birch plywood, CNC routed"
t_nominal = 18.0
t_min = 17.0          # mill tolerance -1.05 (TODO-verify actual stock in app)
t_max = 18.9          # mill tolerance +0.85
density_kg_m3 = 700
E_par = 9000.0        # bending modulus along the face grain, MPa (Baltic/Finnish birch 18 mm ~ 9-10 GPa; TODO-verify Riga Ply handbook)
f_m = 35.0            # bending strength along the face grain, MPa (characteristic, rough; TODO-verify)

[cnc]
bit_d = 6.35          # 1/4" router bit -> dogbone radius bit_d/2
part_gap = 5.0        # min spacing between parts (uMake)
sheet_margin = 20.0   # margin around sheet (uMake)
sheets = [[1524, 1524], [1524, 3048], [1219, 2438]]  # 60x60, 60x120, 48x96 in

[fit]
slot_clearance = 0.3      # added to t_max for cross-lap slots
crush_rib = 0.5           # owner 2026-10-20: bumps on each cross-lap slot wall, proud by this (gap 18.2 at the bumps
crush_rib_r = 10.0        #   for "19mm" birch that's really ~18.0-18.5); sand them if a joint is too tight
crush_rib_at = [0.3, 0.75]
tight = 0.2               # in-plane tenon/mortise clearance
mortise_height_extra = 0.5
wedge_taper = 0.125       # 1:8
inplane_c = 0.2           # per-side clearance for in-plane mating shapes (seams, keys)

[top]                 # owner, 2026-10-20: square 860 x 860, ONE piece (was Ø 900 round: +$199 shipping, and round
                      # futons are hard to get). 860 packs in uMake's 91 cm box = free shipping (docs/quote.md).
shape = "rect"        # rect (one piece, rounded corners) | round: length = width = diameter
length = 860.0
width = 860.0
corner_r = 20.0       # rect only

[frame]               # yagura: 4 straight "+" corner legs (2 crossed plates each) under a deck; no aprons
height = 385.0        # floor to the tenon tops (futon plane); + 18 top + ~10 futon ≈ 41 cm total
overhang = 40.0       # owner 2026-10-20: legs as far apart as reasonable -> frame 780 x 780 under the 860 top
                      # (more room between the legs, much steadier; knees reach 40 mm under the edge)
ear = 30.0            # frame edge -> corner cross-lap centreline; owner 2026-10-20: the outer finger (ear arm, 20.4)
                      # is as wide as the inner one, so the legs are slim strips with the slot in the middle
leg_width = 110.0     # full width under the deck: 20 ear arm | slot | 10 shoulder | 50 tenon | 10 inner shoulder
foot_r = 6.0          # rounding of the plates' outer corners
lap_extra = 0.5       # each cross-lap slot is (leg height)/2 + this, so slot bottoms never bottom out; the floor sets height

[deck]                # horizontal plate on the legs' shoulders; the heater hangs under it
drop = 26.0           # deck top below the futon plane (room for the leg + cheek wedges above it)
# Lightening windows: uMake ships free up to a 91 cm box AND ~20 kg (18.9 kg free, 20.4 kg not).
# "auto" sizes 4 windows from the features around them (kotatsu/yagura.py window_rects).
windows = "auto"
window_style = "notch"  # owner 2026-10-20: open the windows through the edge (an H-shaped deck): ~$20 cheaper
neck = 70.0           # wood joining each corner pad to the middle
mouth_r = 30.0        # owner 2026-10-20: round the notch-mouth corners (the ones away from the legs)
window_margin = 20.0  # clear of the heater, cheeks, cheek wedges, mortises, leg wedges
window_bar = 30.0     # wood left at the deck edge and between windows
window_r = 20.0
# Study (owner 2026-10-20): window_style = "x" makes the deck an X of diagonal arms (kotatsu/yagura.py x_outline)
x_pad = 125.0         # corner pads: this far in from the frame edge (covers the mortises + leg wedges)
x_arm = 110.0         # arm width; the cheek tabs + their wedges sit on the arms, ~45 mm from the axis
x_hub = "none"        # "shield": also a square over the heater, so the futon can't sag onto it
x_hub_margin = 25.0
x_fillet = 30.0

[link]                # owner 2026-10-20: modules link side by side into a row, an L or a 2 x 2 square
enabled = true
tongue_w = 90.0       # a tongue in the middle of each deck notch, out to the edge
edge = 25.0           # wood between the key slot and the deck edge
tab_len = 50.0        # key tab (and slot) length along the link
above = 20.0          # key height above the deck top (deck top 359, futon plane 385)
top_gap = 0.0         # tops touch
root_r = 15.0         # fillet where a tongue meets its notch
tip_r = 8.0
keys_per_module = 1

[yagura]              # leg <-> deck joints
tenon_gap = 10.0      # each plate's tenon starts this far past the cross-lap slot (the shoulder on that side)
tenon_w = 50.4        # tenon width (>= wedge hole + 2 x 15 mm); leg width beyond it is an inner shoulder
hole_h = 14.0         # wedge hole above the deck
hole_drop = 1.0       # hole bottom below the thinnest deck's top face, so the wedge bears on the deck
deck_inset = 10.0     # deck corners stay this far inside the round top
corner_posts = true   # each plate's ear arm rises past the deck to the top: the top rests at the frame corners
                      # (deck corners cut away around them); loose top lifts at ~363 N vs ~205 N without
leg_narrow = 60.0     # owner's haunched legs: plates are this wide (from the frame edge) below the haunch:
                      # 20.4 outer finger | 19.2 slot | 20.4 inner finger
leg_haunch_top = 320.0  # haunch meets the full-width inner edge here (just under the 341 shoulders)
leg_haunch_drop = 30.0  # ... and reaches the narrow line this much lower (a ~31° slope)
leg_haunch_r = 15.0   # inside-corner fillet where the haunch meets the narrow leg
leg_haunch_style = "straight"  # straight (above) | curve: a long quarter-ellipse cove instead (lighter-looking)
leg_haunch_curve_drop = 120.0  # curve: how far below leg_haunch_top the cove starts on the narrow leg
foot_taper = 0.0      # plate A's feet: each edge slopes in by this much at the floor (0 = plumb)
foot_taper_from = 200.0  # ... starting this high above the floor
leg_windows = false   # slot window in each leg plate's inner arm (replaced by the haunched legs)
leg_window_bar = 20.0 # wood each side of it (>= stock thickness, uMake's minimum feature)
leg_window_end = 50.0 # wood below it (floor) and above it (shoulder)
foot_relief = 1.5     # shallow arc under plate A's foot: each plate stands on its two ends
foot_relief_margin = 10.0
one_wedge = true      # owner 2026-10-20: leg and cheek wedges are the same part (one file, 12 + 2 spares)
wedge_len = 60.0      # leg wedges: shorter than the cheek wedges so the two at each corner don't meet
wedge_head = 18.0     # (1:8 taper -> 10.5 mm foot)

[cheek]               # 2 on-edge plates under the deck; the heater screws into their inner faces
length = 372.0
height = 55.0         # = heater body_h + top_gap: the cheek covers the heater's full side, not lower
tab_w = 50.0
tab_spacing = 300.0
tab_above_deck = 21.0 # tab top above (nominal) deck top
hole_h = 14.0         # wedge hole height
hole_drop = 1.0       # hole bottom below the thinnest deck's top face

[cheek_wedge]         # lies on the deck top, driven sideways through the tab hole: pulls the cheek up
length = 60.0         # = the leg wedge (yagura.one_wedge): one wedge part for everything
head = 18.0           # height at the thick end; taper fit.wedge_taper (foot 10.5)

[heater]               # PaletteLife 120V 400W (docs/heater.md). Owner measured 29 x 29 x 5 cm (2026-10-19, to the cm)
model = "PaletteLife B0CKBS16YY"
mount = "side"         # side (screws into on-edge cheeks) | bracket (L-brackets under deck)
body_x = 290.0
body_y = 290.0
body_h = 50.0
cheek_clearance = 4.0  # cheek inner faces = body width + this; 4 mm covers a 290-293 mm body (measured to the cm)
top_gap = 5.0          # heater top below the deck underside (TODO-verify manual clearances)
holes = []             # not cut: the owner drills the heater's screw holes on assembly

[stiffness]           # wobble check (kotatsu/stiffness.py): estimates, TODO-verify the material values
E_perp = 500.0        # plywood stiffness through its thickness (shoulder/wedge bearing on the deck), MPa: rough, 300-800
wedge_preload = 300.0 # clamp force a tapped-in leg wedge gives (N): rough guess
bearing_len = 20.0    # length over which in-plane bearing (tenon face on mortise end) spreads, mm: rough
report_loads = [50.0, 100.0, 200.0]   # sideways pushes at table height to report (N)

[loads]               # kotatsu/loads.py: the loose top under everyday loads (owner 2026-10-20). Rough values, TODO-verify
E_cross = 6500.0      # top's bending stiffness across the face grain, MPa (birch ply ~0.7 x along)
G_plate = 620.0       # in-plane shear modulus (sets the twisting stiffness), MPa
f_m_cross = 30.0      # bending strength across the face grain, MPa (characteristic, rough)
f_v_plate = 9.0       # twisting (in-plane) shear strength at the face, MPa (rough)
nap_kg = 30.0         # head + forearms + some chest resting on the table while napping hunched over
slump = 1.5           # flopping down onto it
cat_kg = 7.0
cat_impact = 4.0      # a cat landing from a jump: peak ~3-4 x body weight on the front paws
laptop_kg = 2.0
sitter_kg = 80.0      # 'beyond normal' check: someone sits on the table

[comfort]
knee_w = 762.0        # owner, cross-legged: knees need 30" wide ...
knee_h = 317.5        # ... x 12.5" high
knee_reach_min = 35.0   # how far that knee zone must reach in under the top's edge (owner chose the 780 frame: 40)
tip_inset = 50.0      # tipping load is computed EN 12521 / EN 1730-style: pushed down at mid-side, 50 mm in from the edge
tip_min_n = 0.0       # no pass/fail limit until we have a real figure (EN 12521:2023 Table 2, or a bathroom-scale test); 0 = report only
heater_kg = 3.0       # for the tipping estimate (TODO weigh the PaletteLife)
futon_kg = 2.0

[room]                # for the Futon & rug page (docs/futons.toml has the candidates)
rug_d = 2440.0        # 8 ft round rug
futon_d = 2032.0      # owner 2026-10-20: an 80 x 80 in square futon (sellers' rule: top + 110-130 cm -> 196-216 for 86)
futon_shape = "square"
drape_k = 0.7         # footprint radius ~ futon radius - drape_k * (frame height + top): rough, futons slope out
zabuton = [635.0, 635.0]  # owner 2026-10-20: square floor pillows, 25 x 25 in
zabuton_h = 90.0      # pillow thickness (3-D view)
zabuton_tuck = 150.0  # each pillow's inner edge sits at least this far under the futon's floor edge (the futon drapes over it)
rug_margin = 20.0     # ...and further in if needed, so every pillow (corners too) stays this far inside the rug
zabuton_ramp = 80.0   # 3-D view: the futon eases from the floor onto a pillow over this distance
rug_t = 10.0          # rug thickness (3-D view)

[layout]              # sheet nesting choices (kotatsu/cutlist.py, kotatsu/nest.py)
frame_grain = "horizontal"  # frame parts keep their grain where it looks right (legs: up the leg); "free" = any rotation
sets = [1]                  # cut layouts for this many copies of the whole set of [[tables]]

[shipping]
std_max_side_in = 48
oversize_max_side_in = 60
max_box_lb = 50

# ------------------------------------------------------------------------------------------------
# The table to build. (Earlier designs live in git history: the 1200 x 900 rectangle with decorative
# seams at tag seams-archive; the slab-side frame and a splayed-leg yagura at tag frame-variants-archive.)
[[tables]]
name = "yagura"
label = "860 × 860 square, yagura frame with slim legs"
