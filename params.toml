[frame]
height = 375.0        # + 18 top + ~10-20 futon = 400-410 total (owner: 39-41 cm)
overhang = 40.0       # top overhang beyond frame on every side
ear = 65.0            # panel end -> crossing centreline (visible "ear"; >= ~60 so the half-height ear fingers are sturdy)
apron_depth = 90.0    # clear height under the aprons = height - apron_depth (leg room)
leg_width = 170.0     # measured from panel end
opening_r = 50.0      # fillet radius of the leg-opening top corners
ear_r = 12.0          # rounding of the panel top/bottom outer corners
foot_r = 6.0          # rounding of the inner foot corners
lap_extra = 0.5       # each cross-lap slot is height/2 + this (so slot bottoms never bottom out; the floor sets height)

[deck]                # horizontal shear plate between the long aprons; heater hangs under it
length_x = 500.0
drop = 40.0           # deck top below apron top edge (room for the cheek wedges above it)
tenons_per_side = 2
tenon_width = 120.0
tenon_spacing = 300.0 # centre-to-centre along x
tenon_protrusion = 50.0   # past outer apron face (tusk)
hole_len = 26.0       # wedge hole length along the tenon
hole_inset = 2.0      # hole inner edge sits this far inside the (thinnest) apron's outer face

[deck_wedge]          # drives down through the tenon hole, bears on the apron's outer face
length = 66.0         # short enough that the tusk never hangs below the apron into knee space,
                      # yet tall enough to take up the full stock-thickness range (~12 mm of travel at 1:8)
head = 27.0           # width at the head; taper fit.wedge_taper

[cheek]               # 2 on-edge plates under the deck; the heater screws into their inner faces
length = 372.0
height = 64.0
tab_w = 50.0
tab_spacing = 300.0
tab_above_deck = 30.0 # tab top above (nominal) deck top
hole_h = 22.0         # wedge hole height
hole_drop = 1.0       # hole bottom below the thinnest deck's top face

[cheek_wedge]         # lies on the deck top, driven sideways through the tab hole: pulls the cheek up
length = 96.0
head = 26.0           # height at the thick end; taper fit.wedge_taper

[heater]               # PaletteLife 120V 400W (docs/heater.md). TODO-verify with calipers
model = "PaletteLife B0CKBS16YY"
mount = "side"         # side (screws into on-edge cheeks) | bracket (L-brackets under deck)
body_x = 292.0
body_y = 292.0
body_h = 51.0
cheek_clearance = 1.0  # cheek inner faces = body width + this
top_gap = 5.0          # heater top below the deck underside (TODO-verify manual clearances)
holes = []             # TODO measure: side screw positions

[comfort]
sitters = [2, 1]      # people per long side, per short side
leg_gap = 360.0       # min opening width per sitter between the legs

[layout]              # sheet nesting choices (kotatsu/cutlist.py, kotatsu/nest.py)
top_grain = "along"         # along = grain runs the table's 1200 mm length, continuous across the 3 boards
                            # across = along each board's 800 mm (plank look). "along" nests better for 2 tables
frame_grain = "horizontal"  # side panels keep their length along the grain (looks right); "free" = any rotation
sets = [1]                  # cut layouts for this many copies of the whole set of [[tables]]

[shipping]
std_max_side_in = 48
oversize_max_side_in = 60
max_box_lb = 50

# ------------------------------------------------------------------------------------------------
# The tables to build (owner, 2026-10: two separate heated kotatsu). Each entry overrides the
# defaults above section by section; everything not mentioned is shared.
[[tables]]
name = "rect"
label = "4×3 ft rectangle (1200 × 900)"
[tables.top]
length = 1200.0
width = 900.0
boards = 3

[[tables]]
name = "round"
label = "3 ft round (Ø 900, one piece)"
[tables.top]
shape = "round"
length = 900.0        # = diameter
width = 900.0
boards = 1
split = "none"
[tables.frame]
overhang = 120.0      # square frame 660 × 660; its ear tips stay ~18 mm inside the circle
ear = 60.0
leg_width = 150.0     # openings 360 = one sitter per side
[tables.deck]
length_x = 480.0      # must clear the short panels (frame is square)
[tables.comfort]
sitters = [1, 1]
