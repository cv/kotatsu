# All dimensions in millimetres. Single source of truth — see AGENTS.md.

[material]
name = "Baltic birch plywood, CNC routed"
t_nominal = 18.0
t_min = 17.0          # mill tolerance -1.05 (TODO-verify actual stock in app)
t_max = 18.9          # mill tolerance +0.85
density_kg_m3 = 700

[cnc]
bit_d = 6.35          # 1/4" router bit -> dogbone radius bit_d/2
part_gap = 5.0        # min spacing between parts (uMake)
sheet_margin = 20.0   # margin around sheet (uMake)
sheets = [[1524, 1524], [1524, 3048], [1219, 2438]]  # 60x60, 60x120, 48x96 in

[fit]
slot_clearance = 0.3      # added to t_max for cross-lap slots
tight = 0.2               # in-plane tenon/mortise clearance
mortise_height_extra = 0.5
wedge_taper = 0.125       # 1:8
inplane_c = 0.2           # per-side clearance for in-plane mating shapes (seams, keys)

[top]
length = 1200.0
width = 800.0
corner_r = 20.0
split = "ari"         # ari | puzzle | chigiri | none   (owner: bow-ties or something more fun)
seam_count = 3

[top.ari]             # dovetail seam (ari-tsugi), tails alternate direction
depth = 70.0
root = 55.0
tip = 95.0

[top.puzzle]          # jigsaw tabs, alternate direction
head_r = 34.0
neck = 36.0

[top.chigiri]         # through bow-tie keys across a straight seam
length = 120.0
width = 64.0
waist = 30.0

[frame]
height = 375.0        # + 18 top + ~10-20 futon = 400-410 total (owner: 39-41 cm)
overhang = 40.0       # top overhang beyond frame on every side
ear = 45.0            # panel end -> crossing centreline
apron_depth = 110.0
leg_width = 130.0     # measured from panel end
opening_r = 50.0      # fillet radius of leg opening

[deck]
length_x = 500.0
drop = 25.0           # deck top below apron top edge
tenons_per_side = 2
tenon_width = 120.0
tenon_protrusion = 50.0   # past outer apron face

[heater]               # PaletteLife 120V 400W (docs/heater.md). TODO-verify with calipers
model = "PaletteLife B0CKBS16YY"
mount = "side"         # side (screws into on-edge cheeks) | bracket (L-brackets under deck)
body_x = 292.0
body_y = 292.0
body_h = 51.0
cheek_clearance = 1.0  # cheek inner faces = body width + this
holes = []             # TODO measure: side screw positions

[shipping]
std_max_side_in = 48
oversize_max_side_in = 60
max_box_lb = 50
