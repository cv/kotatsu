# All dimensions in millimetres. Single source of truth — see AGENTS.md.

[material]
name = "Baltic birch plywood, CNC routed"
t_nominal = 18.0
t_min = 17.0          # mill tolerance -1.05 (TODO-verify actual stock in app)
t_max = 18.9          # mill tolerance +0.85
density_kg_m3 = 700

[cnc]
bit_d = 6.35          # 1/4" router bit -> dogbone radius bit_d/2
part_gap = 5.0        # min spacing between parts (uMake)
sheet_margin = 20.0   # margin around sheet (uMake)
sheets = [[1524, 1524], [1524, 3048], [1219, 2438]]  # 60x60, 60x120, 48x96 in

[fit]
slot_clearance = 0.3      # added to t_max for cross-lap slots
tight = 0.2               # in-plane tenon/mortise clearance
mortise_height_extra = 0.5
wedge_taper = 0.125       # 1:8
inplane_c = 0.2           # per-side clearance for in-plane mating shapes (seams, keys)

[top]                 # owner, 2026-10: one round table, top cut as ONE piece (no seams)
shape = "round"       # round: length = width = diameter | rect (one piece, rounded corners)
length = 900.0        # = diameter
width = 900.0
corner_r = 20.0       # rect only

[frame]
height = 385.0        # + 18 top + ~10 futon ≈ 41 cm total (owner OK'd the top of the 39-41 range for leg room)
overhang = 120.0      # square frame 660 × 660 under the Ø900 top; its ear tips stay ≥ 10 mm inside the circle
ear = 50.0            # panel end -> crossing centreline (visible "ear"); half-height ear fingers 40 wide
apron_depth = 55.0    # clear height under the aprons = height - apron_depth (thighs/knees come in here)
leg_width = 140.0     # from panel end, where the leg meets the apron: ear + half slot + an 80 mm leg zone (deck tenon)
leg_taper = 40.0      # legs narrow by this much at the floor (inner edge slants, outer edge plumb): 140 -> 100,
                      # so the short panels' feet are two equal 40 mm fingers either side of the slot
opening_r = 50.0      # fillet radius of the leg-opening top corners
ear_r = 12.0          # rounding of the panel top/bottom outer corners
foot_r = 6.0          # rounding of the inner foot corners
lap_extra = 0.5       # each cross-lap slot is height/2 + this (so slot bottoms never bottom out; the floor sets height)

[deck]                # horizontal shear plate between two opposite panels; the heater hangs under it
drop = 26.0           # deck top below the apron top edge (room for the cheek tabs + wedges above it)
tenons_per_side = 2   # one through-tenon in each leg zone (outside the leg openings), no wedges:
tenon_width = 40.0    # the cross-laps fix the panel spacing, so the tenons can't pull out
tenon_proud = 2.0     # tenon end stands this far past the nominal outer face (sand flush or leave as a detail)

[cheek]               # 2 on-edge plates under the deck; the heater screws into their inner faces
length = 372.0
height = 56.0         # = heater top gap + body height: cheeks end level with the heater bottom
tab_w = 50.0
tab_spacing = 300.0
tab_above_deck = 21.0 # tab top above (nominal) deck top
hole_h = 14.0         # wedge hole height
hole_drop = 1.0       # hole bottom below the thinnest deck's top face

[cheek_wedge]         # lies on the deck top, driven sideways through the tab hole: pulls the cheek up
length = 80.0
head = 18.0           # height at the thick end; taper fit.wedge_taper (foot 8)

[heater]               # PaletteLife 120V 400W (docs/heater.md). TODO-verify with calipers
model = "PaletteLife B0CKBS16YY"
mount = "side"         # side (screws into on-edge cheeks) | bracket (L-brackets under deck)
body_x = 292.0
body_y = 292.0
body_h = 51.0
cheek_clearance = 1.0  # cheek inner faces = body width + this
top_gap = 5.0          # heater top below the deck underside (TODO-verify manual clearances)
holes = []             # TODO measure: side screw positions

[comfort]
sitters = [1, 1]      # people per side (long, short) - square frame: 4 people
leg_gap = 370.0       # min opening width per sitter between the legs

[room]                # for the Futon & rug page (docs/futons.toml has the candidates)
rug_d = 2440.0        # 8 ft round rug
futon_d = 2050.0      # planned futon (205 cm round = sellers' size for Ø90 round tables)
drape_k = 0.7         # footprint radius ~ futon radius - drape_k * (frame height + top): rough, futons slope out
zabuton = [550.0, 590.0]  # floor cushion w x d (standard meidosu size)

[layout]              # sheet nesting choices (kotatsu/cutlist.py, kotatsu/nest.py)
frame_grain = "horizontal"  # side panels keep their length along the grain (looks right); "free" = any rotation
interlock = true            # also try nesting each long side with a short side upside down, legs interlocked
sets = [1]                  # cut layouts for this many copies of the whole set of [[tables]]

[shipping]
std_max_side_in = 48
oversize_max_side_in = 60
max_box_lb = 50

# ------------------------------------------------------------------------------------------------
# The table(s) to build. Each [[tables]] entry overrides the defaults above section by section.
# (The 1200 x 900 rectangle with decorative seams was dropped; see git tag seams-archive.)
[[tables]]
name = "round"
label = "3 ft round (Ø 900, one piece)"
