[project]
name = "kotatsu"
version = "0.1.0"
description = "Parametric glue-free CNC plywood kotatsu"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "ezdxf>=1.3",
    "shapely>=2.0",
    "matplotlib>=3.8",
    "scikit-fem>=12.0.2",
    "triangle>=20250106",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
