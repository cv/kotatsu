[project]
name = "kotatsu"
version = "0.1.0"
description = "Parametric glue-free CNC plywood kotatsu"
requires-python = ">=3.12"
dependencies = ["ezdxf>=1.3", "shapely>=2.0", "matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
